services:
  redis:
    image: redis:7-alpine
    ports:
      - "6391:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6391"
      REDIS_DB: "0"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-60}"
      MODEL_PATH: "${MODEL_PATH:-models/finbert_model}"
      MODEL_ID: "${MODEL_ID:-}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "realtime_worker.py"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6390"
      REDIS_DB: "0"
      DEFAULT_SYMBOL: "${DEFAULT_SYMBOL:-INFY}"
      REFRESH_INTERVAL_SECONDS: "${REFRESH_INTERVAL_SECONDS:-10}"
    ports:
      - "8503:8501"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app2.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

volumes:
  redis-data:
