# Start everything:  docker compose up -d --build
# Stop everything:   docker compose down

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6391}:6379"   # localhost only; Redis has no password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    image: marketpulse-worker
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"                 # inside the compose network Redis always listens on 6379
      REDIS_DB: "0"
      MODEL_PATH: /app/models/finbert_model
    volumes:
      - ./models:/app/models:ro          # your trained model stays on disk, never baked into the image
      - hf-cache:/app/.hf_cache          # keeps downloaded Hugging Face files between rebuilds
    depends_on:
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 40s               # lets the current cycle finish on shutdown
    logging: *logging
    restart: unless-stopped
    # GPU (NVIDIA Container Toolkit / Docker Desktop WSL2) - also set TORCH_INDEX to the cu121 URL in .env:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  dashboard:
    build:
      context: .
      target: dashboard
    image: marketpulse-dashboard
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8503}:8503"
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
  inference:
    build: {context: ., target: worker}
    image: marketpulse-worker
    command: ["python", "-m", "streaming.consumer"]
    profiles: ["stream"]
    env_file: [.env]
    environment: {REDIS_HOST: redis, REDIS_PORT: "6379", MODEL_PATH: /app/models/finbert_model}
    volumes: ["./models:/app/models:ro", "hf-cache:/app/.hf_cache"]
    depends_on: {redis: {condition: service_healthy}}
    init: true
    stop_grace_period: 40s
    restart: unless-stopped


  # --- streaming pipeline (docker compose --profile stream up -d --build) ---
  # ingestor -> news.raw -> inference (FinBERT) -> news.scored -> aggregator -> Redis signals + SQLite
  ingestor:
    build: {context: ., target: worker}
    image: marketpulse-worker
    command: ["python", "-m", "streaming.ingestor"]
    profiles: ["stream"]
    env_file: [.env]
    environment: {REDIS_HOST: redis, REDIS_PORT: "6379"}
    depends_on: {redis: {condition: service_healthy}}
    init: true
    restart: unless-stopped
    logging: *logging

  aggregator:                       # run exactly ONE instance (per-symbol signal state)
    build: {context: ., target: worker}
    image: marketpulse-worker
    command: ["python", "-m", "streaming.aggregator"]
    profiles: ["stream"]
    env_file: [.env]
    environment: {REDIS_HOST: redis, REDIS_PORT: "6379", REDIS_DB: "0", MARKETPULSE_DB: /app/data/marketpulse.db}
    volumes: ["mp-data:/app/data"]  # durable research store: scored headlines + signals
    depends_on: {redis: {condition: service_healthy}}
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *logging

  metrics:                          # http://localhost:9108/metrics  (Prometheus text) and /healthz
    build: {context: ., target: worker}
    image: marketpulse-worker
    command: ["python", "-m", "streaming.metrics"]
    profiles: ["stream"]
    environment: {REDIS_HOST: redis, REDIS_PORT: "6379"}
    ports: ["127.0.0.1:${METRICS_PORT:-9108}:9108"]
    depends_on: {redis: {condition: service_healthy}}
    init: true
    restart: unless-stopped
    logging: *logging

volumes:
  redis-data:
  hf-cache:
  mp-data: