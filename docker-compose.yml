
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "realtime_worker.py"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6380"
      REDIS_DB: "0"
    ports:
      - "8503:8503"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app2.py
      - --server.address=0.0.0.0
      - --server.port=8503
      - --server.headless=true
      - --browser.gatherUsageStats=false

volumes:
  redis-data:
